# Design guide: component catalog
design.components.title=Components
design.components.heading=Component catalog
design.components.lead=Every pattern is rendered with the markup the running UI ships: parameterized patterns call the project module's own fragments, so there is no second version that could drift. The DOM of this page is the copy source.
design.components.inert=The specimens are inert: htmx is disabled inside them and no form names a route.
design.components.pageHeader=Page header
design.components.pageHeader.note=Title and lead; the muted meta line above carries the reference or the module.
design.components.projectHeader=Project header
design.components.projectHeader.note=Reference, state, name and provenance — the same fragment above every page inside a project. Shown in its archived state, where the lifecycle buttons give way to the read-only notice.
design.components.breadcrumb=Breadcrumb
design.components.breadcrumb.note=The project first, the open item last; every step above leads back.
design.components.badges=Status badges
design.components.badges.note=One fragment, one status key and one modifier per state.
design.components.badges.project=Project status
design.components.badges.item=Item status
design.components.chips=Label chips
design.components.chips.note=Label names are data and never translated; an empty set renders no row at all.
design.components.cards=Cards
design.components.cards.note=One surface per section, optionally with a header row for title and action.
design.components.rows=Rows
design.components.rows.note=Reference and title link, the state is a badge or a select.
design.components.rows.list=Project rows (lean)
design.components.rows.plan=Plan rows (editable)
design.components.record=Record
design.components.record.note=Term left, value right; machine-readable values in mono.
design.components.forms=Forms
design.components.forms.note=One form per field in the editor grid; the route and the htmx attributes belong to the page that uses the pattern.
design.components.forms.filters=Filter row
design.components.forms.editors=Editor grid
design.components.buttons=Buttons
design.components.buttons.note=One class, three intents; a link carries the same class.
design.components.alerts=Alerts and notices
design.components.alerts.note=The API's words, never rephrased.
design.components.alerts.upstream=Backend unreachable
design.components.alerts.problem=Rejected write (400/409)
design.components.alerts.field=Field message under the control
design.components.states=States
design.components.states.note=Nothing to show is a state of its own, not an empty box.
design.sample.title=Example title
design.sample.text=Quiet example text: replaced by real content once the page carries it.
