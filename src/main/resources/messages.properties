# Design guide: the dashboard's own style guide (structure + component catalog). The guide
# is developer-facing chrome like every other page, so it translates through both bundles;
# wire field names, route patterns and CSS class names inside it stay untranslated.
design.structure.title=Grundstruktur
design.structure.heading=Grundstruktur des Dashboards
design.structure.lead=Rahmen, Seiten und Schnittstellenobjekte — statisch, mit Beispielinhalt und ohne Live-Daten.
