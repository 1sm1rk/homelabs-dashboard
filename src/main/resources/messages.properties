# Design guide: component catalog
design.components.title=Komponenten
design.components.heading=Komponentenkatalog
design.components.lead=Jedes Muster ist mit dem Markup der laufenden Oberfläche gerendert: die parametrierten Muster rufen die Fragmente des Projektmoduls auf, es gibt keine zweite Fassung, die abweichen könnte. Kopiervorlage ist damit das DOM dieser Seite.
design.components.inert=Die Muster sind inert: htmx ist in den Beispielen abgeschaltet und kein Formular nennt eine Route.
design.components.pageHeader=Seitenkopf
design.components.pageHeader.note=Titel und Einleitung; die gedämpfte Metazeile darüber trägt Referenz oder Modul.
design.components.projectHeader=Projektkopf
design.components.projectHeader.note=Referenz, Zustand, Name und Herkunft — dasselbe Fragment über jeder Seite innerhalb eines Projekts. Hier im archivierten Zustand, in dem die Lebenszyklus-Schaltflächen dem Schreibschutz-Hinweis weichen.
design.components.breadcrumb=Pfad
design.components.breadcrumb.note=Das Projekt zuerst, der offene Eintrag zuletzt; jeder Schritt darüber führt zurück.
design.components.badges=Status-Badges
design.components.badges.note=Ein Fragment, ein Status-Schlüssel und ein Modifier pro Zustand.
design.components.badges.project=Projektstatus
design.components.badges.item=Status der Einträge
design.components.chips=Label-Chips
design.components.chips.note=Labelnamen sind Daten und werden nie übersetzt; ein leeres Set rendert gar keine Zeile.
design.components.cards=Karten
design.components.cards.note=Eine Fläche pro Abschnitt, optional mit Kopfzeile für Titel und Aktion.
design.components.rows=Zeilen
design.components.rows.note=Referenz und Titel verlinken, der Zustand ist ein Badge oder eine Auswahl.
design.components.rows.list=Projektzeilen (schlank)
design.components.rows.plan=Planzeilen (bearbeitbar)
design.components.record=Datensatz
design.components.record.note=Begriff links, Wert rechts; maschinenlesbare Werte in Mono.
design.components.forms=Formulare
design.components.forms.note=Ein Formular pro Feld im Editor-Raster; die Route und die htmx-Attribute setzt die Seite, die das Muster einsetzt.
design.components.forms.filters=Filterzeile
design.components.forms.editors=Editor-Raster
design.components.buttons=Schaltflächen
design.components.buttons.note=Eine Klasse, drei Absichten; ein Link trägt dieselbe Klasse.
design.components.alerts=Hinweise und Fehler
design.components.alerts.note=Die Worte der Schnittstelle, nie umformuliert.
design.components.alerts.upstream=Backend nicht erreichbar
design.components.alerts.problem=Abgelehnter Schreibzugriff (400/409)
design.components.alerts.field=Feldmeldung unter dem Steuerelement
design.components.states=Zustände
design.components.states.note=Ein leerer Abschnitt ist ein eigener Zustand, keine leere Fläche.
design.sample.title=Beispieltitel
design.sample.text=Ruhiger Beispieltext: ersetzt durch echten Inhalt, sobald die Seite ihn trägt.
