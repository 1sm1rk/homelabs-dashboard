spring:
  application:
    name: homelabs-dashboard
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            # Confidential client of the shared realm. The values are deployment data:
            # the realm is public, the client secret never is — so the secret has NO
            # default here and the application refuses to start without
            # DASHBOARD_CLIENT_SECRET.
            client-id: ${DASHBOARD_CLIENT_ID:dashboard}
            client-secret: ${DASHBOARD_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            # Authorization Code + PKCE: Spring adds the code challenge as soon as the
            # provider advertises its challenge methods (this realm does), so nothing is
            # pinned here.
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            # Default points at the live shared realm (it is public), so a dev run logs
            # in as soon as the dashboard client exists in that realm.
            issuer-uri: ${DASHBOARD_ISSUER_URI:https://auth.homelabs.de/realms/homelabs}

homelabs:
  dashboard:
    modules:
      projects:
        # Module 1's REST API: prod container alias http://projects:8090, dev
        # http://localhost:8093 (the backend's own dev port).
        api-url: ${DASHBOARD_PROJECTS_API_URL:http://localhost:8093}

server:
  port: 8094
  # Trust the proxy's X-Forwarded-* headers so OAuth callback URLs compose as
  # https://dashboard.homelabs.de behind the TLS edge (Caddy sets them on
  # reverse_proxy). Headers only when present: a direct dev run on 8094 is
  # unaffected.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # The session cookie is unreadable for scripts, rides only same-site requests
        # (the login round-trip is a top-level redirect, so lax covers it) and is marked
        # Secure. Browsers treat http://localhost as a secure context and therefore keep
        # a Secure cookie there too, so the dev run on port 8094 keeps its session; in
        # production the cookie only ever travels over TLS, terminated by the Caddy edge.
        http-only: true
        same-site: lax
        secure: true

logging:
  level:
    de.homelabs.dashboard: DEBUG
