<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de"
      th:replace="~{layout :: page(title=${project.name}, content=~{::content})}">
<body>
<div class="page" th:fragment="content">
    <header class="page__header">
        <p class="page__meta">
            <span class="mono muted" th:text="${project.reference}">WEB</span>
            <span th:replace="~{projects/fragments :: badge(${project.statusKey}, ${project.statusClass})}"></span>
            <span th:replace="~{projects/fragments :: chips(${project.labels})}"></span>
        </p>
        <h1 class="page__title" th:text="${project.name}">Project</h1>
        <p class="muted">
            <span th:text="#{projects.detail.owner}">Owner</span>
            <span th:text="${project.ownerName}">name</span>
            <span th:if="${project.updatedAt != null}">·</span>
            <span th:if="${project.updatedAt != null}" th:text="#{projects.detail.updated}">Updated</span>
            <time th:if="${project.updatedAt != null}"
                  th:text="${#temporals.format(project.updatedAt, 'yyyy-MM-dd HH:mm')}">2026-11-02 12:00</time>
        </p>
    </header>

    <!-- Canonical content. The backend sanitizes every description against its allowlist
         before it is stored, and the derived plain text stays available for lists; the
         dashboard renders the stored HTML as HTML and never re-parses it. -->
    <section class="card prose" th:if="${!#strings.isEmpty(project.descriptionHtml)}">
        <div th:utext="${project.descriptionHtml}">description</div>
    </section>

    <!-- The plan tree in the backend's plan order: work packages as the API delivers them,
         the tasks grouped under their package in the same wire order, and the tasks
         without a package as their own group after the packages. Nothing here is sorted:
         the plan order belongs to the backend. -->
    <section class="card">
        <h2 class="card__title" th:text="#{projects.detail.tree}">Plan</h2>
        <p class="empty" th:if="${#lists.isEmpty(tree.packages) and #lists.isEmpty(tree.ungroupedTasks)}"
           th:text="#{projects.tree.empty}">No work packages yet.</p>
        <table class="tree" th:if="${!#lists.isEmpty(tree.packages)}">
            <thead>
            <tr>
                <th th:text="#{projects.table.reference}">Reference</th>
                <th th:text="#{projects.table.title}">Title</th>
                <th th:text="#{projects.table.status}">Status</th>
                <th th:text="#{projects.table.assignee}">Assignee</th>
                <th th:text="#{projects.table.due}">Due</th>
                <th th:text="#{projects.table.position}">Position</th>
            </tr>
            </thead>
            <tbody th:each="node : ${tree.packages}">
            <tr th:replace="~{projects/fragments :: itemRow(${node.workPackage}, 'tree__package')}"></tr>
            <th:block th:each="task : ${node.tasks}">
                <tr th:replace="~{projects/fragments :: itemRow(${task}, 'tree__task')}"></tr>
            </th:block>
            <tr th:if="${#lists.isEmpty(node.tasks)}">
                <td colspan="6" class="empty" th:text="#{projects.tree.noTasks}">No tasks in this work package.</td>
            </tr>
            </tbody>
        </table>
        <div class="tree__loose" th:if="${!#lists.isEmpty(tree.ungroupedTasks)}">
            <h3 class="tree__loose-title" th:text="#{projects.tree.ungrouped}">Tasks without a work package</h3>
            <table class="tree">
                <tbody>
                <th:block th:each="task : ${tree.ungroupedTasks}">
                    <tr th:replace="~{projects/fragments :: itemRow(${task}, 'tree__task')}"></tr>
                </th:block>
                </tbody>
            </table>
        </div>
    </section>

    <!-- The three sections load with the page and each can refresh itself in place. -->
    <section th:replace="~{projects/comments :: section}"></section>
    <section th:replace="~{projects/activity :: section}"></section>
    <section th:replace="~{projects/attachments :: section}"></section>
</div>
</body>
</html>
