<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<body>
<!-- The module's one badge: text from a status message key, colour from the status
     class. Both status vocabularies (project lifecycle and item status) render through
     it, so a new status costs a key and a modifier, not a component. -->
<span th:fragment="badge(labelKey, modifier)" class="badge" th:classappend="${modifier}"
      th:text="#{__${labelKey}__}">status</span>

<!-- Label chips: label names are backend data and never translated; an empty label set
     renders nothing at all (no empty chip row). -->
<span th:fragment="chips(labels)" class="chips" th:if="${!#lists.isEmpty(labels)}">
    <span class="chip" th:each="label : ${labels}" th:text="${label}">label</span>
</span>

<!-- The header of the open project: reference, state, name, who created it, when it last
     changed. It sits above every page inside the project — the detail itself and both
     item pages — so the way back and the lifecycle never move between them. -->
<header class="page__header" th:fragment="projectHeader">
    <p class="page__meta">
        <span class="mono muted" th:text="${project.reference}">WEB</span>
        <span th:replace="~{projects/fragments :: badge(${project.statusKey}, ${project.statusClass})}"></span>
        <span th:replace="~{projects/fragments :: chips(${project.labels})}"></span>
    </p>
    <h1 class="page__title" th:text="${project.name}">Project</h1>
    <p class="muted">
        <span th:text="#{projects.detail.owner}">Owner</span>
        <span th:text="${project.ownerName}">name</span>
        <span th:if="${project.updatedAt != null}">·</span>
        <span th:if="${project.updatedAt != null}" th:text="#{projects.detail.updated}">Updated</span>
        <time th:if="${project.updatedAt != null}"
              th:text="${#temporals.format(project.updatedAt, 'yyyy-MM-dd HH:mm')}">2026-11-02 12:00</time>
    </p>
    <!-- The explicit lifecycle moves. The API never takes a status as a PATCH field, so
         each move is its own POST; archived is terminal and offers nothing. The plain
         action is the no-script path, like everywhere else in the module. -->
    <div class="actions" th:if="${project.status != 'archived'}">
        <form th:if="${project.status == 'active'}"
              th:with="action=@{/projects/{reference}/deactivate(reference=${project.reference})}"
              th:action="${action}" method="post"
              th:attr="hx-post=${action}" hx-target="#main" hx-swap="innerHTML">
            <button class="button button--ghost" type="submit"
                    th:text="#{projects.detail.deactivate}">Deactivate</button>
        </form>
        <form th:if="${project.status == 'deactivated'}"
              th:with="action=@{/projects/{reference}/activate(reference=${project.reference})}"
              th:action="${action}" method="post"
              th:attr="hx-post=${action}" hx-target="#main" hx-swap="innerHTML">
            <button class="button button--ghost" type="submit"
                    th:text="#{projects.detail.activate}">Activate</button>
        </form>
        <form th:with="action=@{/projects/{reference}/archive(reference=${project.reference})}"
              th:action="${action}" method="post"
              th:attr="hx-post=${action}"
              th:hx-confirm="#{projects.detail.archiveConfirm}"
              hx-target="#main" hx-swap="innerHTML">
            <button class="button button--danger" type="submit"
                    th:text="#{projects.detail.archive}">Archive</button>
        </form>
    </div>
    <!-- Archived stays readable and keeps its controls: a write the API refuses then
         explains itself right here or at the control, instead of the UI guessing. -->
    <p class="muted" th:if="${project.status == 'archived'}" th:text="#{projects.detail.readOnly}">Archived.</p>
    <div class="field-error" id="project-notice" role="alert"></div>
</header>

<!-- The trail above an item page: the project, the work package a task belongs to, and
     the open item. Every crumb above the open item leads back to the project's page —
     the trail names where the reader is, the project is always the way back. -->
<nav class="breadcrumb" th:fragment="breadcrumb" th:aria-label="#{projects.breadcrumb.label}">
    <ol class="breadcrumb__list">
        <li class="breadcrumb__item" th:each="crumb : ${breadcrumb.ancestors}">
            <a th:href="@{${crumb.path}}" th:text="${crumb.label}">WEB</a>
        </li>
        <li class="breadcrumb__item breadcrumb__item--current" th:text="${breadcrumb.current}">WEB-1</li>
    </ol>
</nav>

<!-- One work-package or task row of the plan tree. The reference and the title link into
     the item's own page — a plain link, because an item page is a page. Each editor lives
     in its own form and sends exactly one field: the API's tri-state then falls out of
     the UI — absent means unchanged, an empty assignee or due date clears, a sort order
     (1 = first) moves the item. The row keeps a notice block of its own so a rejected
     write lands next to the control that caused it. -->
<tr th:fragment="itemRow(item, rowClass, kind)" th:class="${rowClass}"
    th:with="patch=@{/projects/{reference}/{kind}/{item}(reference=${reference}, kind=${kind}, item=${item.reference})}">
    <td class="mono tree__reference">
        <a th:href="${patch}" th:text="${item.reference}">WEB-1</a>
    </td>
    <td class="tree__title">
        <a th:href="${patch}" th:text="${item.title}">title</a>
    </td>
    <td>
        <form class="inline-form" th:attr="hx-patch=${patch}" hx-target="#plan" hx-swap="outerHTML"
              hx-trigger="change">
            <select class="status-select" name="status" th:classappend="${item.statusClass}"
                    th:aria-label="#{projects.table.status}">
                <option th:each="option : ${itemStatusOptions}" th:value="${option.value}"
                        th:selected="${option.value == item.status}" th:text="#{__${option.labelKey}__}">todo</option>
            </select>
        </form>
    </td>
    <td>
        <form class="inline-form" th:attr="hx-patch=${patch}" hx-target="#plan" hx-swap="outerHTML"
              hx-trigger="change">
            <input class="inline-input inline-input--assignee" type="text" name="assignee_sub"
                   th:value="${item.assigneeSub}" th:aria-label="#{projects.table.assignee}">
        </form>
        <span class="muted" th:text="${item.assignee} ?: #{projects.item.unassigned}">di.mueller</span>
    </td>
    <td>
        <form class="inline-form" th:attr="hx-patch=${patch}" hx-target="#plan" hx-swap="outerHTML"
              hx-trigger="change">
            <input class="inline-input" type="date" name="due_date" th:value="${item.dueDate}"
                   th:aria-label="#{projects.table.due}">
        </form>
    </td>
    <td>
        <form class="inline-form" th:attr="hx-patch=${patch}" hx-target="#plan" hx-swap="outerHTML"
              hx-trigger="change">
            <input class="inline-input inline-input--position" type="number" min="1" name="sort_order"
                   th:value="${item.sortOrder}" th:aria-label="#{projects.table.position}">
        </form>
    </td>
    <td class="tree__error">
        <div class="field-error" th:id="|item-notice-${item.reference}|" role="alert"></div>
    </td>
</tr>

<!-- A rejected write, as the API wrote it: the localized headline names the kind of
     problem, the segments keep its own words, and a field message keeps the WIRE field
     name next to it — that is the name a retry has to use. Suggestions of a short-code
     collision render as the code strings themselves, so the reader can pick one. -->
<div class="alert" th:fragment="problem">
    <p th:text="#{__${headingKey}__}">The projects API rejected the request.</p>
    <ul class="problem" th:if="${!#lists.isEmpty(problem.segments)}">
        <li th:each="segment : ${problem.segments}">
            <code class="problem__field" th:if="${segment.wireField != null}" th:text="${segment.wireField}">short_code</code>
            <span th:text="${segment.text}">message</span>
        </li>
    </ul>
    <div class="problem__suggestions" th:if="${!#lists.isEmpty(problem.suggestions)}">
        <p th:text="#{projects.form.suggestions}">Taken. These are free:</p>
        <ul class="problem">
            <li th:each="suggestion : ${problem.suggestions}"><code th:text="${suggestion}">WEB2</code></li>
        </ul>
    </div>
</div>
</body>
</html>
