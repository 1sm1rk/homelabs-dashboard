<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${currentLocale}" lang="de" th:fragment="page(title, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} · #{shell.brand}|">homelabs</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">
    <script th:src="@{/js/htmx.min.js}" src="/js/htmx.min.js" defer></script>
</head>
<body>
<div class="shell">
    <!-- The rail is rendered from the module registry: adding a module never edits
         this template. The rail label is a message key from the descriptor, so the
         shell renders it in the reader's language. -->
    <nav class="rail" th:aria-label="#{shell.modules.label}" aria-label="Modules">
        <a class="rail__brand" th:href="@{/}" th:text="#{shell.brand}">homelabs</a>
        <ul class="rail__list">
            <li th:each="module : ${modules}" class="rail__item">
                <a class="rail__link" th:href="@{${module.basePath}}" th:text="#{__${module.navKey()}__}">Projects</a>
            </li>
        </ul>
    </nav>
    <div class="workspace">
        <header class="topbar">
            <span class="topbar__title" th:text="${title}">homelabs</span>
            <div class="topbar__meta">
                <!-- Language switch: two plain links, full reload, no script. The active
                     locale is marked for assistive technology and for the stylesheet. -->
                <nav class="topbar__locales" th:aria-label="#{shell.locale.label}" aria-label="Language">
                    <a class="topbar__locale" lang="de" th:href="@{${currentPath}(lang='de')}"
                       th:classappend="${currentLocale == 'de'} ? 'topbar__locale--active' : ''"
                       th:attr="aria-current=${currentLocale == 'de'} ? 'true' : null">de</a>
                    <a class="topbar__locale" lang="en" th:href="@{${currentPath}(lang='en')}"
                       th:classappend="${currentLocale == 'en'} ? 'topbar__locale--active' : ''"
                       th:attr="aria-current=${currentLocale == 'en'} ? 'true' : null">en</a>
                </nav>
                <!-- Identity of the signed-in user and the sign-out form: signing out is a
                     session mutation, so it is a POST through the security chain. The
                     CSRF token arrives as the hidden field that Thymeleaf adds for a
                     th:action form — the same token every other mutation carries. -->
                <div class="topbar__identity" th:if="${currentUser != null}">
                    <span class="topbar__user" th:text="${currentUser}">user</span>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="button button--ghost" th:text="#{shell.signout}">Sign out</button>
                    </form>
                </div>
            </div>
        </header>
        <!-- Subnav of the module whose route is open. A module without a subnav leaves
             no bar behind: the block renders nothing at all, the row collapses. -->
        <nav class="subnav" th:if="${activeModule != null and !#lists.isEmpty(activeModule.subnav)}"
             th:aria-label="#{shell.subnav.label}" aria-label="Module navigation">
            <ul class="subnav__list">
                <li th:each="item : ${activeModule.subnav}" class="subnav__item">
                    <a class="subnav__link" th:href="@{${item.path}}" th:text="#{__${item.labelKey()}__}">entry</a>
                </li>
            </ul>
        </nav>
        <main class="content">
            <th:block th:replace="${content}"/>
        </main>
    </div>
</div>
</body>
</html>
