# CI/CD for the dashboard.
#
# Flow: feature branch -> pull request (verify) -> merge to main (verify +
# container image).
#
# A red `verify` blocks the publish: `publish-image` declares it as a
# dependency, so no image is ever built from unverified code.
#
# Branch protection requires the check by NAME, which only becomes enforceable
# once the check has reported a first time — so the protection rule is added
# after the first green run of `verify` on `main`.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PR builds supersede each other; a push to main never cancels a running job
# (a cancelled run would leave `latest` behind the merge it belongs to).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/1sm1rk/homelabs-dashboard

jobs:
  # Branch protection points at exactly this job name: keep `verify` stable.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Unit tests (surefire) plus the *IT integration tests (failsafe). The
      # ITs run a fake JDK-HttpServer projects API: no Docker daemon, no
      # database, no model — the dashboard is stateless.
      - name: mvn verify
        run: mvn -B -ntp verify

  # Every merge to main produces a ready-to-pull image: `latest` for the
  # deployment hosts, `sha-<commit>` to pin or roll back a specific build.
  publish-image:
    name: publish-image
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The build context is the repository root: single module, no sibling
      # checkout.
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the short-commit tag
        id: tags
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.tags.outputs.short_sha }}
